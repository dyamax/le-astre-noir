<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Progress Bar</title>

    <style>
        /* Full-page loader background */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loader p {
            color: white;
            font-family: futura;
            text-transform: uppercase;
            font-size: 10vh;
            line-height: 0;
        }

        /* Progress bar container (background bar) */
        .porgress {
            width: 20%;
            height: 8px;
            background: #1e1e1e; /* Dark gray background */
            position: relative;
            overflow: hidden;
            border-radius: 5px;
        }

        /* Actual progress bar */
        #progress-bar {
            width: 0%;
            height: 100%;
            background: white;
            transition: width 0.2s ease;
            border-radius: 5px;
        }

        /* Main content (hidden during loading) */
        #content {
            display: none;
            padding: 20px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Loader -->
    <div class="loader">
        <div class="porgress">
            <div id="progress-bar"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="content">
        <h1>Welcome to My Website</h1>
        <p>This is the main content that appears after loading.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let progressBar = document.getElementById("progress-bar");
            let loaderContainer = document.querySelector(".loader");
            let content = document.getElementById("content");

            function loadProgress() {
                let progress = 0;
                let interval = setInterval(() => {
                    progress += Math.random() * ( Math.random() * .7 ) * 5;
                    progressBar.style.width = progress + "%";

                    if (progress >= 100) {
                        clearInterval(interval);
                        setTimeout(() => {
                            loaderContainer.style.display = "none";
                            content.style.display = "block";
                        }, 700);
                    }
                }, 50);
            }

            loadProgress();
        });
    </script>

</body>
</html>
